name: PostgreSQL and SQLite Integration Tests

on:
  pull_request:
    paths:
      - ".github/actions/setup-python-uv/**"
      - ".github/workflows/postgres.yml"
      - "sql/tests/**"
      - "sql/snsql/**"
      - "sql/pyproject.toml"
      - "!sql/tests/setup/sqlserver/**"
      - "!sql/tests/setup/mysql/**"
      - "!sql/tests/setup/bigquery/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEFAULT_PYTHON_VERSION: "3.12"
  POSTGRES_DB: postgres
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PASSWORD: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: postgres

jobs:
  postgres-sqlite-ubuntu:
    name: PostgreSQL and SQLite Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up repo bootstrap
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          editable-projects: |
            sql
          requirements-files: |
            sql/tests/requirements.txt
            sql/tests/setup/postgres/requirements.txt

      - name: Load PostgreSQL fixtures
        run: |
          fixture_dir="${RUNNER_TEMP}/postgres-pums"
          rm -rf "${fixture_dir}"
          mkdir -p "${fixture_dir}"

          tail -n +2 datasets/PUMS.csv > "${fixture_dir}/PUMS.csv"
          tail -n +2 datasets/PUMS_large.csv > "${fixture_dir}/PUMS_large.csv"
          tail -n +2 datasets/PUMS_pid.csv > "${fixture_dir}/PUMS_pid.csv"
          tail -n +2 datasets/PUMS_dup.csv > "${fixture_dir}/PUMS_dup.csv"
          tail -n +2 datasets/PUMS_null.csv > "${fixture_dir}/PUMS_null.csv"
          cp sql/tests/setup/postgres/PUMS/pums.sql "${fixture_dir}/pums.sql"

          docker cp "${fixture_dir}/." "${{ job.services.postgres.id }}:/tmp/postgres-pums"
          docker exec \
            -e PGPASSWORD="${POSTGRES_PASSWORD}" \
            "${{ job.services.postgres.id }}" \
            bash -lc "cd /tmp/postgres-pums && psql -h localhost -U '${POSTGRES_USER}' -d '${POSTGRES_DB}' -f pums.sql"

      - name: Verify database counts
        run: |
          docker exec -e PGPASSWORD="${POSTGRES_PASSWORD}" "${{ job.services.postgres.id }}" psql -h localhost -U "${POSTGRES_USER}" -d pums -c "select count(*) FROM pums.pums"
          docker exec -e PGPASSWORD="${POSTGRES_PASSWORD}" "${{ job.services.postgres.id }}" psql -h localhost -U "${POSTGRES_USER}" -d pums -c "select count(*) FROM pums.pums_large"
          docker exec -e PGPASSWORD="${POSTGRES_PASSWORD}" "${{ job.services.postgres.id }}" psql -h localhost -U "${POSTGRES_USER}" -d pums_pid -c "select count(*) FROM pums.pums"
          docker exec -e PGPASSWORD="${POSTGRES_PASSWORD}" "${{ job.services.postgres.id }}" psql -h localhost -U "${POSTGRES_USER}" -d pums_dup -c "select count(*) FROM pums.pums"
          docker exec -e PGPASSWORD="${POSTGRES_PASSWORD}" "${{ job.services.postgres.id }}" psql -h localhost -U "${POSTGRES_USER}" -d pums_null -c "select count(*) FROM pums"

      - name: Check database connections test fixture
        run: |
          mkdir -p ~/.smartnoise
          cp sql/tests/setup/postgres/connections-unit.yaml ~/.smartnoise/connections-unit.yaml
          cd sql
          python tests/check_databases.py
        env:
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: Test SDK
        run: |
          cd sql
          pytest tests
        env:
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          SKIP_PANDAS: "1"
          TEST_SQLITE: "1"
