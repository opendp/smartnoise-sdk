name: Test Documentation Build

on:
  pull_request:
    paths:
      - ".github/actions/setup-python-uv/**"
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "sql/docs/**"
      - "synth/docs/**"
      - "eval/docs/**"
      - "sql/snsql/**"
      - "synth/snsynth/**"
      - "eval/sneval/**"
      - "sql/pyproject.toml"
      - "synth/pyproject.toml"
      - "eval/pyproject.toml"
      - "sql/VERSION"
      - "synth/VERSION"
      - "eval/VERSION"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEFAULT_PYTHON_VERSION: "3.12"

jobs:
  build-linux:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up repo bootstrap
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          editable-projects: |
            sql
            synth
            eval
          requirements-files: |
            docs/requirements.txt
            sql/docs/requirements.txt
            synth/docs/requirements.txt
            eval/docs/requirements.txt

      - name: Build top-level docs
        run: |
          make -C docs html

      - name: Build SQL docs
        run: |
          make -C sql/docs html

      - name: Build synth docs
        run: |
          make -C synth/docs html

      - name: Build eval docs
        run: |
          make -C eval/docs html
