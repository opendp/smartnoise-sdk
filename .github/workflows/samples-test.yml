name: Run Sample Notebooks

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEFAULT_PYTHON_VERSION: "3.12"
  MPLBACKEND: Agg
  NOTEBOOK_SANDBOX: .tmp/notebook-smoke

jobs:
  build-linux:
    name: Sample notebooks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up repo bootstrap
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          editable-projects: |
            sql
            synth
          package-specs: |
            ipykernel
            matplotlib
            nbmake

      - name: Prepare notebook smoke set
        run: |
          set -euo pipefail
          rm -rf "${NOTEBOOK_SANDBOX}"
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path.cwd()
          sandbox = root / os.environ["NOTEBOOK_SANDBOX"]
          notebooks = [
              Path("sql/samples/SQL Queries.ipynb"),
              Path("synth/samples/aggregate_seeded_sample/aggregate_seeded_short_sample.ipynb"),
              Path("synth/samples/mst_sample/mst_sample_pums.ipynb"),
              Path("synth/samples/mwem_sample/Visualizing MWEM.ipynb"),
          ]
          support_files = [
              Path("synth/samples/aggregate_seeded_sample/utils.py"),
          ]

          def should_drop_cell(cell):
              if cell.get("cell_type") != "code":
                  return False
              lines = [line.strip() for line in "".join(cell.get("source", [])).splitlines() if line.strip()]
              return bool(lines) and all(
                  line.startswith(("!pip install", "%pip install"))
                  for line in lines
              )

          for notebook in notebooks:
              source = root / notebook
              target = sandbox / notebook
              target.parent.mkdir(parents=True, exist_ok=True)
              payload = json.loads(source.read_text())
              payload["cells"] = [cell for cell in payload.get("cells", []) if not should_drop_cell(cell)]
              target.write_text(json.dumps(payload, indent=1) + "\n")

          for support_file in support_files:
              source = root / support_file
              target = sandbox / support_file
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          PY

      - name: Test notebooks
        run: |
          pytest --nbmake --nbmake-timeout=600 \
            "${NOTEBOOK_SANDBOX}/sql/samples/SQL Queries.ipynb" \
            "${NOTEBOOK_SANDBOX}/synth/samples/aggregate_seeded_sample/aggregate_seeded_short_sample.ipynb" \
            "${NOTEBOOK_SANDBOX}/synth/samples/mst_sample/mst_sample_pums.ipynb" \
            "${NOTEBOOK_SANDBOX}/synth/samples/mwem_sample/Visualizing MWEM.ipynb"
