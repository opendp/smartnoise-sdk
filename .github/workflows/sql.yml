name: SQL on Pandas

on:
  pull_request:
    paths:
      - ".github/actions/setup-python-uv/**"
      - ".github/workflows/sql.yml"
      - "sql/tests/**"
      - "sql/snsql/**"
      - "sql/pyproject.toml"
      - "!sql/tests/setup/postgres/**"
      - "!sql/tests/setup/sqlserver/**"
      - "!sql/tests/setup/mysql/**"
      - "!sql/tests/setup/bigquery/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql-pandas-ubuntu:
    name: SQL on Pandas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      max-parallel: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up repo bootstrap
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ matrix.python-version }}
          editable-projects: |
            sql
          requirements-files: |
            sql/tests/requirements.txt

      - name: Test SDK
        run: |
          cd sql
          pytest tests
