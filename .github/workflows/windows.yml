name: SQL on Pandas and LocalDB on Windows

on:
  pull_request:
    paths:
      - ".github/actions/setup-python-uv/**"
      - ".github/workflows/windows.yml"
      - "sql/tests/**"
      - "sql/snsql/**"
      - "sql/pyproject.toml"
      - "!sql/tests/setup/postgres/**"
      - "!sql/tests/setup/mysql/**"
      - "!sql/tests/setup/bigquery/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEFAULT_PYTHON_VERSION: "3.12"

jobs:
  windows-localdb:
    name: SQL on Pandas and LocalDB on Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Set up repo bootstrap
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          editable-projects: |
            sql
          requirements-files: |
            sql/tests/requirements.txt
            sql/tests/setup/sqlserver/requirements.txt

      - name: Prepare test datasets and connection fixture
        shell: pwsh
        run: |
          Set-Location sql
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.smartnoise" | Out-Null
          Copy-Item tests\setup\sqlserver\connections-unit-localdb.yaml "$env:USERPROFILE\.smartnoise\connections-unit.yaml" -Force
          python tests\check_databases.py

      - name: Install databases in LocalDB
        shell: cmd
        run: |
          SQLLocalDB info
          cd sql\tests\setup\sqlserver\PUMS
          .\install_localdb.cmd

      - name: Show installed databases
        shell: pwsh
        run: |
          Set-Location sql
          python tests\check_databases.py

      - name: Unit tests
        shell: pwsh
        run: |
          Set-Location sql
          pytest tests
