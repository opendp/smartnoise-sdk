name: MySQL Integration Tests

on:
  pull_request:
    paths:
      - ".github/actions/setup-python-uv/**"
      - ".github/workflows/mysql.yml"
      - "sql/tests/**"
      - "sql/snsql/**"
      - "sql/pyproject.toml"
      - "!sql/tests/setup/postgres/**"
      - "!sql/tests/setup/sqlserver/**"
      - "!sql/tests/setup/bigquery/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEFAULT_PYTHON_VERSION: "3.12"
  MYSQL_HOST: 127.0.0.1
  MYSQL_PASSWORD: runnerpass
  MYSQL_PORT: "3306"
  MYSQL_ROOT_PASSWORD: rootpass
  MYSQL_USER: runner

jobs:
  mysql-ubuntu:
    name: MySQL Integration Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - name: Set up repo bootstrap
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          editable-projects: |
            sql
          requirements-files: |
            sql/tests/requirements.txt
            sql/tests/setup/mysql/requirements.txt

      - name: Create MySQL CI user
        run: |
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" -e "
            CREATE USER IF NOT EXISTS '${MYSQL_USER}'@'%' IDENTIFIED BY '${MYSQL_PASSWORD}';
            GRANT ALL ON *.* TO '${MYSQL_USER}'@'%' WITH GRANT OPTION;
            FLUSH PRIVILEGES;
            SHOW VARIABLES LIKE 'secure_file_priv';
          "

      - name: Stage MySQL fixture files
        run: |
          export MYSQL_TEST_DATA_DIR="${RUNNER_TEMP}/mysql-files"
          rm -rf "${MYSQL_TEST_DATA_DIR}"
          mkdir -p "${MYSQL_TEST_DATA_DIR}"
          python sql/tests/setup/mysql/copy.py
          docker exec "${{ job.services.mysql.id }}" mkdir -p /var/lib/mysql-files
          docker cp "${MYSQL_TEST_DATA_DIR}/." "${{ job.services.mysql.id }}:/var/lib/mysql-files"

      - name: Install tables to MySQL
        run: |
          docker exec -i "${{ job.services.mysql.id }}" mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" < sql/tests/setup/mysql/create_tables.sql

      - name: Check database connections test fixture
        run: |
          mkdir -p ~/.smartnoise
          cp sql/tests/setup/mysql/connections-unit.yaml ~/.smartnoise/connections-unit.yaml
          cd sql
          python tests/check_databases.py
        env:
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}

      - name: Check DB install
        run: |
          docker exec "${{ job.services.mysql.id }}" mysql -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" -e "USE PUMS_large; SELECT COUNT(*) FROM pums_large;"
          docker exec "${{ job.services.mysql.id }}" mysql -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" -e "USE PUMS; SELECT COUNT(*) FROM pums;"
          docker exec "${{ job.services.mysql.id }}" mysql -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" -e "USE PUMS_dup; SELECT COUNT(*) FROM pums;"
          docker exec "${{ job.services.mysql.id }}" mysql -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" -e "USE PUMS_null; SELECT COUNT(*) FROM pums;"
          docker exec "${{ job.services.mysql.id }}" mysql -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" -e "USE PUMS_pid; SELECT COUNT(*) FROM pums;"

      - name: Test SDK
        run: |
          cd sql
          pytest tests
        env:
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
          SKIP_PANDAS: "1"
